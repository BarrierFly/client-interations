# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Long running test servers and the client hold the daemon; keeping it off also makes
# `./gradlew build` exit cleanly in scripts.
org.gradle.daemon=false

# Mod metadata
mod_version=1.2.1
maven_group=peoplecanfly

# Loom
# The newest Loom release is used for every Minecraft target. It needs Java 25 to *run*
# Gradle; each subproject still compiles with the Java release level that its Minecraft
# version requires (see versions/<mc>/gradle.properties).
loom_version=1.18.4
