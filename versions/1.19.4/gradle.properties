# Minecraft version this subproject targets.
# Loom's newest release is required to support 26.x, and it is also able to
# build 1.19.4 - 1.21.11, so one toolchain is used for everything.
minecraft_version=1.19.4

# Mappings are always the official Mojang mappings. 26.3 is not obfuscated,
# so Loom needs no mapping dependency for it (see versions/26.3/build.gradle).
loader_version=0.16.10

# Java release level required by this Minecraft version.
java_release=17

# Fabric API
fabric_api_version=0.87.2+1.19.4

# ModMenu
modmenu_version=6.3.1

# Fabric API modules actually used, so that the compile classpath stays small.
fabric_api_modules=fabric-api-base,fabric-key-binding-api-v1,fabric-lifecycle-events-v1,fabric-rendering-v1
