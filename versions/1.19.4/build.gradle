// One Minecraft target. The build script is shared by every version and reads its
// values from the local gradle.properties.
//
// A single, newest Loom release builds every target: newer Loom versions still know
// how to build older Minecraft versions, which keeps the whole matrix on one toolchain.
plugins {
    id 'fabric-loom' version "${loom_version}"
}

base {
    archivesName = "clientinteractions-${minecraft_version}"
}

// The version independent logic lives in common/ and is compiled straight into every
// jar, so the mod stays a single, dependency free file. It is unit tested through the
// common project, which is part of this build.
sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/clientinteractions.accesswidener')
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = project.java_release as int
}

// Gradle itself has to run on Java 25 (the newest Loom requires it), but the game must run on the
// Java version its Minecraft release targets: 1.19.4 and 1.20.1 predate Java 21 and their bundled
// Mixin cannot read class files newer than Java 17. Telling Loom which launcher to use keeps both
// requirements satisfied.
def javaRelease = project.java_release as int

tasks.withType(JavaExec).configureEach {
    def launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    javaLauncher.set(launcher)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_release)
    targetCompatibility = JavaVersion.toVersion(project.java_release)
    withSourcesJar()
}

processResources {
    def props = [
            'version'          : project.mod_version,
            'minecraft_version': project.minecraft_version,
            'loader_version'   : project.loader_version,
    ]
    inputs.properties(props)

    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_clientinteractions" }
    }
}

// Verifies the packaged jar, not the development output.
//
// A defect shipped once because these differ: Loom applies the access widener to the development
// classpath regardless of what fabric.mod.json says, so a jar that forgot to declare it worked in
// runClient and threw IllegalAccessError (private field class_310.field_1752) for users. The jar
// must declare the widener, contain the file, and use the namespace the game runs with.
tasks.register('verifyReleaseJar') {
    dependsOn 'remapJar'
    group = 'verification'
    description = 'Checks that the release jar declares a usable access widener.'

    def jarTask = tasks.named('remapJar')
    def expectedNamespace = project.minecraft_version.startsWith('26.') ? 'official' : 'intermediary'

    doLast {
        def jarFile = jarTask.get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)

        try {
            def meta = zip.getEntry('fabric.mod.json')

            if (meta == null) {
                throw new GradleException("${jarFile.name} has no fabric.mod.json")
            }

            def text = zip.getInputStream(meta).getText('UTF-8')
            def declared = (text =~ /"accessWidener"\s*:\s*"([^"]+)"/)

            if (!declared.find()) {
                throw new GradleException(
                        "${jarFile.name} does not declare accessWidener in fabric.mod.json; "
                                + 'every widened Minecraft member would throw IllegalAccessError at runtime')
            }

            def awName = declared.group(1)
            def awEntry = zip.getEntry(awName)

            if (awEntry == null) {
                throw new GradleException("${jarFile.name} declares ${awName} but the file is missing")
            }

            def header = zip.getInputStream(awEntry).getText('UTF-8').readLines().first().trim()
            def namespace = header.split('\\s+')[2]

            if (namespace != expectedNamespace) {
                throw new GradleException(
                        "${jarFile.name}: access widener namespace is ${namespace} but the game runs "
                                + "with ${expectedNamespace} for Minecraft ${project.minecraft_version}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}
